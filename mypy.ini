; mypy configuration for pyhack.
;
; Run it from the repository root (the directory holding this file):
;
;     mypy                  # checks the files= set below
;     mypy core/step.py     # or a single module / directory
;
; This is mypy's defaults plus the file set, nothing else: no error
; code is suppressed and no stricter flag is on, so the reported count
; is the honest one.  The two systematic problems of this C port were
; fixed by file structure, not by configuration:
;
;   * the constant tables -- objects.py / monst.py are split into
;     *_defs.py (the declarations), *_data.py (the tables) and the API
;     module, so no constant is ever typed across an import cycle;
;   * the 480-member ObjType -- a literal enum class in
;     core/objects_enum.py instead of a functional IntEnum(...) built
;     from a data table, so a type checker can see the members.
;
; Both are described in CHANGES.md and in the module docstrings.

[mypy]
python_version = 3.14

; What a bare `mypy` checks: the simulation, the UI, the entry point
; and the test suite.  Listing them explicitly also keeps mypy out of
; the stray "~" directory a past session left in the checkout.
files = core, ui, tests, main.py, conftest.py

; Cache next to the checkout (.gitignore already covers it).
cache_dir = .mypy_cache

; Report config sections/flags that no longer match anything, so a
; stale override cannot linger silently.
warn_unused_configs = True

; Keep the output stable for the error-counting workflow: one line per
; error, always with its error code.
pretty = False
show_error_codes = True

; ====================================================================
; Not enabled yet -- switch on one at a time, with the count at zero
; ====================================================================
; check_untyped_defs = True
;   The bodies of unannotated functions are not checked at all today;
;   most of the C-port builders (objects_defs._weapon & friends,
;   monst_defs._mon, ...) are varargs-shaped on purpose, so this is the
;   largest single jump.
; disallow_untyped_defs
; disallow_incomplete_defs
; warn_return_any
; strict_equality
; no_implicit_reexport
;   objects.py / monst.py re-export their *_defs names; the ones in
;   __all__ are explicit re-exports, but the PM_* anchors monst.py
;   re-exports for the game code would need `as` aliases or an __all__
;   entry first.
; ====================================================================
